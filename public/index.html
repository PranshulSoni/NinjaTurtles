<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninja Turtles - Food Ordering Platform</title>

  <!-- Tailwind CSS & Vue 3 via standard CDN (Zero build configs needed!) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app" class="min-h-screen flex flex-col justify-between">
    <div>
      <!-- TOP HEADER -->
      <header class="bg-white border-b border-gray-300 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900 leading-tight">Ninja Turtles</h1>
            <p class="text-xs text-gray-500">Food Ordering Platform</p>
          </div>
        </div>
      </header>

      <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="bg-white border border-gray-300 rounded p-6 text-center">
          <p class="text-gray-600 font-medium">Setting up food catalog and restaurant menu...</p>
        </div>
      </main>
    </div>

    <footer class="bg-white border-t border-gray-300 py-4 text-center text-xs text-gray-500 mt-12">
      Ninja Turtles Food Platform • Full-Stack Assignment
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
