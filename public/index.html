<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninja Turtles - Food Ordering Platform</title>

  <!-- Tailwind CSS & Vue 3 via standard CDN (Zero build configs needed!) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app" class="min-h-screen flex flex-col justify-between">
    <div>
      <!-- TOP NAVIGATION BAR -->
      <header class="bg-white border-b border-gray-300 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <!-- Team Name & Brand -->
          <div @click="currentView = 'restaurants'" class="cursor-pointer">
            <h1 class="text-xl font-bold text-gray-900 leading-tight">Ninja Turtles</h1>
            <p class="text-xs text-gray-500">Food Ordering Platform</p>
          </div>

          <!-- Nav Tabs -->
          <div class="flex items-center gap-2">
            <button
              @click="currentView = 'restaurants'"
              :class="[
                'px-3 py-1.5 rounded text-sm font-medium border',
                currentView === 'restaurants' || currentView === 'menu'
                  ? 'bg-blue-600 text-white border-blue-600'
                  : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100'
              ]"
            >
              Order Food
            </button>

            <button
              @click="currentView = 'orders'"
              :class="[
                'px-3 py-1.5 rounded text-sm font-medium border',
                currentView === 'orders'
                  ? 'bg-blue-600 text-white border-blue-600'
                  : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100'
              ]"
            >
              My Orders <span v-if="activeOrdersCount > 0">({{ activeOrdersCount }})</span>
            </button>

            <button
              @click="currentView = 'restaurant-admin'"
              :class="[
                'px-3 py-1.5 rounded text-sm font-medium border',
                currentView === 'restaurant-admin'
                  ? 'bg-green-600 text-white border-green-600'
                  : 'bg-white text-green-700 border-green-600 hover:bg-green-50'
              ]"
            >
              Restaurant Portal (Admin)
            </button>
          </div>

          <!-- Right Cart Button -->
          <div class="flex items-center gap-3">
            <button
              @click="isCartOpen = true"
              class="bg-gray-900 hover:bg-black text-white text-sm font-medium px-3.5 py-1.5 rounded border border-gray-900 flex items-center gap-1.5"
            >
              <span>🛒 Cart</span>
              <span>({{ cartCount }})</span>
              <span v-if="cartCount > 0">• ₹{{ cartTotal }}</span>
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN CONTENT VIEW ROUTER -->
      <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="bg-white border border-gray-300 rounded p-6 text-center">
          <p class="text-gray-600 font-medium">Ready to load restaurant catalog.</p>
        </div>
      </main>
    </div>

    <footer class="bg-white border-t border-gray-300 py-4 text-center text-xs text-gray-500 mt-12">
      Ninja Turtles Food Platform • Full-Stack Assignment
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
